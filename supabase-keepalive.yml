name: Supabase keep-alive

# O Supabase gratuito pausa projetos com pouca atividade em 7 dias.
# Este fluxo faz algumas consultas simples por dia no banco para o
# projeto continuar contando como ativo.

on:
  schedule:
    - cron: "0 12 * * *"   # todo dia, 12:00 UTC (09:00 em Brasília)
  workflow_dispatch:        # permite rodar manualmente (aba Actions)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a função ping() do Supabase
        env:
          # A chave "publishable" é pública (já está no js/supabase.js).
          # NUNCA coloque aqui a chave service_role.
          SUPABASE_URL: "https://uhyyorhjvkfhnwuvuwre.supabase.co"
          SUPABASE_KEY: "sb_publishable_Ub083BnaVDWT88Idc1GhZQ_syCT2bE_"
        run: |
          for i in 1 2 3; do
            curl --fail-with-body --silent --show-error --max-time 30 \
              -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              -d '{}'
            echo
            sleep 3
          done
          echo "Pings enviados com sucesso."
