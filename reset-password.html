<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova senha - Grana Alinhada</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #050b1a;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 420px;

            padding: 35px;

            background: rgba(255, 255, 255, 0.04);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 18px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        p {
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 25px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 13px 15px;

            border-radius: 10px;

            border: 1px solid rgba(255, 255, 255, 0.12);

            background: rgba(255, 255, 255, 0.05);

            color: white;

            outline: none;
        }

        input:focus {
            border-color: #6ee7b7;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #22c55e;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 18px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Crie uma nova senha</h1>

        <p>
            Digite sua nova senha para recuperar o acesso
            à sua conta do Grana Alinhada.
        </p>

        <form id="resetPasswordForm">

            <label for="newPassword">
                Nova senha
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Digite sua nova senha"
                required
                minlength="6"
            >

            <label for="confirmPassword">
                Confirmar nova senha
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Digite novamente sua senha"
                required
                minlength="6"
            >

            <button type="submit">
                Alterar senha
            </button>

        </form>

        <div id="message"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/reset-password.js"></script>

</body>

</html>
